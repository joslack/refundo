[project]
name = "refundo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.21",
    "langsmith>=0.14.4",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed in editable mode, so `world` imports the same way from tests, Streamlit and scripts.
[tool.hatch.build.targets.wheel]
packages = ["world"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
