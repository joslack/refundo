<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refundo trial page</title>
<!--
A renderer for LangSmith's custom output rendering (docs.langchain.com/langsmith/custom-output-rendering).

LangSmith loads this page from an https address, in a frame sandboxed to scripts and the page's own origin, in place of
its own view of a run's output. When the frame has loaded, and five more times over the next three seconds, it posts
    { type: "output" | "reference", data: <a run's outputs, or an example's reference outputs>, metadata: { inputs } }
The page holds no data. It draws what it is sent:

    a trial's outputs   as evals/langsmith_plugin.py records them, in two views with a switch between them
    an answer key       an example's reference outputs: action, amount, sections and the reason
    anything else       the fields as sent, so a run from another project can still be read

A trial's two views:

    Experiments         every experiment of the trial's commit: share right against cost and against seconds in model
                        calls, each with its Pareto line; one measure for each agent with each model; and the cases
                        with wrong trials, one column per experiment. The trial's own experiment and case are marked
    This trial          what the agent proposed beside the grader's scores, the customer's message, the rationale, the
                        reply to the customer, the tokens, its tool calls, and its case in every experiment

A frame is sent one run, or one answer key. The proposal is shown beside the answer key where the key reaches the page:
in the same frame, or in another frame of this page on the same screen, which passes it on. Scores other than the
grader's, other runs and the experiment are not sent, so what the page shows across runs it reads from files of its own:

    ?journeys=<url>      the tool calls of every trial, as evals/journeys.py writes them:
                         {"commit", "trials": {<trial name>: {"case", "graph", "model", "effort", "right", "steps"}}}, where
                         steps is a list of steps and a step is the list of labels of the calls one model message made.
                         The page shows the run's own steps, and its experiment's trials merged while their steps agree.
    ?results=<url>       the folder that holds results.csv and cases.csv, the tables evals/pareto.py writes. Without it
                         the page reads results/<commit>/ beside itself, taking the commit from the run's outputs.
    ?view=experiments|trial   the view a trial opens on, experiments without it. The view a reader picks is kept in
                         the browser, and every frame of the page follows it.
    ?theme=light|dark    the theme; without it the page follows the system's

An address is resolved against this page's. A run is found in the files by its trial name.

LangSmith takes the page's address in a dataset's, a tracing project's or an annotation queue's Custom Output Rendering
setting. To serve it from this machine, put this page, the journeys file and results/<commit>/ in one folder, and keep
the key outside it:

    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 30 -keyout key.pem -out cert.pem \
        -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -addext "extendedKeyUsage=serverAuth"
    python3 -m http.server 8765 --bind 127.0.0.1 --directory <folder> --tls-cert cert.pem --tls-key key.pem

The address is then https://localhost:8765/langsmith_render.html?journeys=<file>. The browser has to trust cert.pem
before it will load the frame. Ctrl-C stops the server. The server's TLS options came with Python 3.14.

evals/langsmith_render_harness.py writes a page that sends this one real payloads without LangSmith.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column for a frame about 480px wide and 300 to 600px tall, the verdict first. The tokens and type are
   those of evals/explore_page.html. --s0 to --s3 are the colors of the models in the charts. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #16202b; --muted: #5b6978; --line: #d7dde4; --accent: #0b6e69;
  --good: #1c7449; --good-bg: #e2f2e9; --part: #8f5a00; --part-bg: #fbeed3; --bad: #b0271f; --bad-bg: #fbe3e1;
  --dim: #8a95a1; --s0: #0b6e69; --s1: #c2570c; --s2: #5b4bc4; --s3: #6f7c89;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e26; --ink: #e6eaef; --muted: #98a5b3; --line: #2a3440; --accent: #58c4bc;
    --good: #72d19b; --good-bg: #16321f; --part: #e8b75a; --part-bg: #392d12; --bad: #f39088; --bad-bg: #3c1a18;
    --dim: #626e7b; --s0: #58c4bc; --s1: #f0a15c; --s2: #a99bf5; --s3: #98a5b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e6eaef; --muted: #98a5b3; --line: #2a3440; --accent: #58c4bc;
  --good: #72d19b; --good-bg: #16321f; --part: #e8b75a; --part-bg: #392d12; --bad: #f39088; --bad-bg: #3c1a18;
  --dim: #626e7b; --s0: #58c4bc; --s1: #f0a15c; --s2: #a99bf5; --s3: #98a5b3;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.45; }
main { padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 14px; max-width: 880px; }
section { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
section:empty { display: none; }
h1 { font-family: var(--mono); font-size: 15px; font-weight: 500; margin: 0; }
h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
p { margin: 0; }
.head { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; }
.tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; white-space: nowrap; }
.tag.name, th.code { text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 11.5px; font-weight: 500; }
.chip { font-size: 12px; padding: 0 7px; border-radius: 3px; white-space: nowrap; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.no { background: var(--bad-bg); color: var(--bad); }
.chip.na { border: 1px solid var(--line); color: var(--muted); }
.code { font-family: var(--mono); font-size: 12.5px; }
.sub { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; max-width: 80ch; }
.meta { color: var(--muted); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 80ch; }

.scroll { overflow-x: auto; }

.cmp td:last-child, .cmp th:last-child { padding-right: 0; white-space: nowrap; }
.unnamed { text-decoration: underline wavy var(--bad); text-underline-offset: 3px; }
.pair { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr); gap: 3px 14px; margin: 0; }
.pair dt { color: var(--muted); overflow-wrap: anywhere; }
.pair dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
pre.json { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; background: var(--bg); border-radius: 4px; padding: 6px 8px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }

.steps i, .tree i { font-style: normal; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }

.share { display: inline-flex; gap: 2px; height: 6px; align-self: center; flex: none; }
.share b { border-radius: 2px; background: var(--good); min-width: 1px; }
.share b.wrong { background: var(--bad); }

summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell { display: inline-block; min-width: 30px; text-align: center; padding: 0 6px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }
.cell.all { background: var(--good-bg); color: var(--good); }
.cell.some { background: var(--part-bg); color: var(--part); }
.cell.none { background: var(--bad-bg); color: var(--bad); }
.cell.here { outline: 2px solid var(--accent); outline-offset: 1px; }
.over { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
tr.here td { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.tabs { display: flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.tabs button { font: inherit; font-size: 12.5px; padding: 3px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }

.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pick { color: var(--muted); font-size: 12px; }
.pick select { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; max-width: 100%; }
th.wrap { white-space: normal; max-width: 104px; }
td.here { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.miss th, .miss td { padding: 2px 2px; text-align: center; vertical-align: middle; }
.miss th[scope="row"], .miss thead th:first-child { text-align: left; padding-right: 8px; }
.miss th.group { border-bottom: 0; padding-top: 0; }
.miss th.up { vertical-align: bottom; padding-bottom: 4px; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.miss th.up span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.miss td.first, .miss th.group + th.group { border-left: 1px solid var(--line); }
.miss td.num { text-align: right; padding: 2px 6px; }
.miss .cell { min-width: 16px; min-height: 18px; line-height: 18px; padding: 0 3px; vertical-align: middle; }
.chart { position: relative; max-width: 560px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.chart text.name { font-family: var(--sans); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.mark { fill: var(--dim); }
.chart .mark { stroke: var(--surface); stroke-width: 1.5; }
.chart .spread { stroke: var(--dim); stroke-width: 1; }
.m0 .mark { fill: var(--s0); } .m1 .mark { fill: var(--s1); } .m2 .mark { fill: var(--s2); } .m3 .mark { fill: var(--s3); }
.m0 .spread { stroke: var(--s0); } .m1 .spread { stroke: var(--s1); } .m2 .spread { stroke: var(--s2); } .m3 .spread { stroke: var(--s3); }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.front { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.chart .near .mark { stroke: var(--ink); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 3px 7px; border-radius: 4px; font-size: 11.5px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); display: flex; flex-direction: column; gap: 3px; }
.tip b { display: block; font-weight: 600; }

</style>

<body>
<main id="view"><p class="sub">The page waits for a message from LangSmith.</p></main>

<script>
const $ = (id) => document.getElementById(id);
function build(node, attrs, kids) {
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") node.textContent = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  return node;
}
const el = (tag, attrs = {}, ...kids) => build(document.createElement(tag), attrs, kids);
const svg = (tag, attrs = {}, ...kids) => build(document.createElementNS("http://www.w3.org/2000/svg", tag), attrs, kids);
const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const empty = (v) => v === null || v === undefined || v === "" || (typeof v === "object" && Object.keys(v).length === 0);
const number = (v) => (typeof v === "number" || (typeof v === "string" && v.trim() !== "")) && Number.isFinite(Number(v)) ? Number(v) : null;
const count = (n) => n.toLocaleString("en-US");
const dollars = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (cents) => number(cents) === null ? "no amount" : dollars(number(cents) / 100);
const words = (v) => typeof v === "string" ? v : Array.isArray(v) ? v.map((b) => isObject(b) && typeof b.text === "string" ? b.text : "").join("") : "";
// Sections as a list, whether they came as a list or as the JSON text of one.
function sectionsOf(v) {
  if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = v.split(","); } }
  return Array.isArray(v) ? v.map((s) => String(s).trim()).filter(Boolean) : [];
}

const params = new URLSearchParams(location.search);
if (["light", "dark"].includes(params.get("theme"))) document.documentElement.setAttribute("data-theme", params.get("theme"));

// What this frame has been sent: the latest message of each type, each as { data, inputs, task, text }; the answer
// keys other frames passed on, by task; and the files read so far, by address.
const state = { output: null, reference: null, shared: {}, files: {} };
// Kept across redraws, and filled again when a file arrives.
const tiles = el("section"), strip = el("section"), tree = el("section"), board = el("section"), overview = el("div", { class: "over" });

// A trial has two views. The one a reader picks is kept in the browser, where every frame of this page reads it.
const VIEWS = [["experiments", "Experiments"], ["trial", "This trial"]], KEPT = "refundo-view";
const isView = (name) => VIEWS.some(([known]) => known === name);
const kept = () => { try { return localStorage.getItem(KEPT); } catch (e) { return null; } };
let view = [kept(), params.get("view"), "experiments"].find(isView);
function show(name) {
  view = name;
  try { localStorage.setItem(KEPT, name); } catch (e) {}
  draw();
}
window.addEventListener("storage", (event) => { if (event.key === KEPT && isView(event.newValue) && event.newValue !== view) { view = event.newValue; draw(); } });
// Fill the sections of the view on the screen. The other view's files are read when a reader opens it.
function refresh() {
  if (view === "trial") { drawTiles(); drawJourneys(); drawBoard(); } else drawOverview();
}

// A trial's outputs carry Harbor's fields. An answer key is an action with an amount or sections and none of them.
const isTrial = (d) => isObject(d) && ["trial_name", "rewards", "reply", "agent_metadata"].some((k) => k in d);
const isAnswer = (d) => isObject(d) && "action" in d && ("amount_cents" in d || "sections" in d) && !isTrial(d);
const trialEntry = () => state.output && isTrial(state.output.data) ? state.output : null;
// LangSmith has sent reference outputs under either type, so an output that is an answer key is read as one.
function keyEntry() {
  if (state.reference && isAnswer(state.reference.data)) return state.reference;
  return state.output && !state.reference && isAnswer(state.output.data) ? state.output : null;
}
function keyFor(trial) {
  const key = keyEntry();
  if (key && (!key.task || !trial.task || key.task === trial.task)) return key.data;
  return state.shared[trial.task] || null;
}
function taskOf(data, inputs) {
  const name = [data, inputs].map((o) => isObject(o) && typeof o.task_name === "string" ? o.task_name : "").find(Boolean) || "";
  return name.split("/").pop();
}
// The run's inputs carry the trial's name in a run's own pane. The outputs carry it everywhere.
const trialName = (trial) => [trial.data.trial_name, trial.inputs.trial_name].find((name) => typeof name === "string" && name) || null;

// ---- messages
function receive(message) {
  const inputs = isObject(message.metadata) && isObject(message.metadata.inputs) ? message.metadata.inputs : {};
  let text;
  try { text = JSON.stringify([message.data, inputs]); } catch (e) { text = null; }
  const last = state[message.type];
  if (last && text !== null && last.text === text) return;  // the same message, sent again
  const entry = { data: message.data, inputs, task: taskOf(message.data, inputs), text };
  // A frame put to use for another run: a key that does not say which case it is for belonged to the run before.
  if (message.type === "output" && state.output && state.reference && !state.reference.task && state.output.task !== entry.task) state.reference = null;
  state[message.type] = entry;
  share();
  draw();
}
// To the other frames on the same screen that this page's origin also serves. A frame with no origin of its own,
// one whose sandbox takes it away or one opened from a file, can address no one, and the call throws.
function tell(message, target) {
  try {
    const frames = target ? [target] : Array.from({ length: parent.frames.length }, (_, i) => parent.frames[i]).filter((w) => w !== window);
    for (const frame of frames) frame.postMessage(message, location.origin);
  } catch (e) {}
}
function share() {
  const key = keyEntry(), trial = trialEntry();
  if (key && key.task) tell({ refundo: "key", task: key.task, data: key.data });
  if (trial && trial.task && !keyFor(trial)) tell({ refundo: "want", task: trial.task });
}
function fromFrame(message, source) {
  const key = keyEntry();
  if (message.refundo === "want" && key && key.task && key.task === message.task) tell({ refundo: "key", task: key.task, data: key.data }, source);
  if (message.refundo !== "key" || typeof message.task !== "string" || !isAnswer(message.data)) return;
  state.shared[message.task] = message.data;
  const trial = trialEntry();
  if (trial && trial.task === message.task) draw();
}
window.addEventListener("message", (event) => {
  const message = event.data;
  if (!isObject(message)) return;
  if (message.refundo) { if (event.origin === location.origin && event.source !== window) fromFrame(message, event.source); }
  else if (message.type === "output" || message.type === "reference") receive(message);
});
setTimeout(() => {
  if (!state.output && !state.reference) $("view").replaceChildren(el("p", { class: "sub", text: "LangSmith sent no message. This page shows the output of one trial. If you open the page directly, the page shows no data." }));
}, 8000);

// ---- files
// What the page has read from beside itself, by address: { loading }, { missing: why }, or what the file held.
function fetched(address, read) {
  if (!state.files[address]) {
    state.files[address] = { loading: true };
    read().catch((e) => ({ missing: String(e && e.message || e) })).then((found) => { state.files[address] = found; refresh(); });
  }
  return state.files[address];
}
async function get(address, kind) {
  const response = await fetch(address);
  if (!response.ok) throw new Error(`the server sent status ${response.status}`);
  return response[kind]();
}
// Rows of a CSV file as objects keyed by its header. A quoted field may hold commas, quotes and line breaks.
function rows(text) {
  const table = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) { if (c !== '"') field += c; else if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
    else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); table.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field !== "" || row.length) { row.push(field); table.push(row); }
  const [header, ...body] = table;
  return header ? body.filter((r) => r.length === header.length).map((r) => Object.fromEntries(header.map((k, i) => [k, r[i]]))) : [];
}
// The folder of tables for a trial: the one named in the address, or the one for the commit its agent code was
// copied at, which evals/run.py writes into the name of that copy.
function folderOf(t) {
  if (params.get("results")) return params.get("results").replace(/\/?$/, "/");
  const copy = isObject(t.agent_metadata) && typeof t.agent_metadata.langgraph_project_path === "string" ? t.agent_metadata.langgraph_project_path : "";

  });
  const charts = AXES.map((axis) => paretoChart(all, axis)).filter(Boolean);
  const cases = distinct(tables.cases.map((r) => r.case)).length, repeats = Math.max(0, ...all.map((r) => number(r.repeats) || 0));
  overview.replaceChildren(...[
    el("p", { class: "meta", text: [`${all.length} experiments`, `${cases} cases`, repeats > 1 ? `${repeats} trials for each case` : null, `result tables ${folder}`].filter(Boolean).join(" · ") }),
    charts.length ? keyOf(all, graphs, models) : null, ...charts,
    charts.length ? el("p", { class: "note", text: "Each mark is one experiment that has all cases. The color shows the model. The shape shows the agent."
      + (all.some((r) => r.sd) ? " A vertical line gives the standard deviation for one pass through all cases. This value is a lower limit, because it counts only the cases where the passes disagree. Point to a mark to see its values." : " Point to a mark to see its values.")
      + (charts.length < AXES.length ? " The result tables do not give the time in model calls." : " The time in model calls comes from the LangSmith traces.") }) : null,
    measureGrid(all), missGrid(tables, all, graphs, models, trial.task, mine), allTable(all)].filter(Boolean));
}

function keyOf(all, graphs, models) {
  const shape = (i) => svg("svg", { viewBox: "0 0 12 12" }, svg("path", { class: "mark", d: SHAPES[i % SHAPES.length](6, 6, 4) }));
  return el("p", { class: "key" },
    models.map((m, i) => el("span", { class: `m${i % COLORS}` }, svg("svg", { viewBox: "0 0 12 12" }, svg("rect", { class: "mark", x: 0, y: 4, width: 12, height: 4, rx: 1 })), m)),
    graphs.length > 1 ? graphs.map((g, i) => el("span", {}, shape(i), "agent " + g)) : null,
    el("span", {}, svg("svg", { viewBox: "0 0 16 12", style: "width:16px" }, svg("line", { class: "front", x1: 0, x2: 16, y1: 6, y2: 6 })), "Pareto line"),
    all.some((r) => r.mine) ? el("span", {}, svg("svg", { viewBox: "0 0 12 12" }, svg("circle", { class: "ring", cx: 6, cy: 6, r: 4.5 })), "the experiment of this trial") : null);
}

// Share right against one other measure, one mark per experiment that has every case, with the Pareto line of
// evals/pareto.py. The mark nearest the pointer gives its values, and the table under the charts holds every value.
function paretoChart(all, axis) {
  const shown = all.map((r) => ({ ...r, x: number(r[axis.key]) })).filter((r) => r.complete === "True" && r.x > 0 && r.y !== null);
  if (!shown.length) return null;
  const W = 460, H = 236, left = 34, right = 14, top = 24, bottom = 30;
  const xs = shown.map((r) => r.x);
  let lo = 0, hi, ticks = [];
  if (axis.log) {
    lo = Math.min(...xs) * 0.7;
    hi = Math.max(...xs) * 1.45;
    for (let power = Math.floor(Math.log10(lo)); power <= Math.ceil(Math.log10(hi)); power++) for (const m of [1, 2, 5]) if (m * 10 ** power >= lo && m * 10 ** power <= hi) ticks.push({ m, v: m * 10 ** power });
    if (ticks.length > 6) ticks = ticks.filter((tick) => tick.m === 1);
  } else {
    const span = Math.max(...xs) - Math.min(...xs) || Math.max(...xs), pad = span * 0.06;
    const step = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500].find((s) => (span + 2 * pad) / s <= 8) || 1000;
    lo = Math.max(0, Math.floor((Math.min(...xs) - pad) / step) * step);
    hi = Math.ceil((Math.max(...xs) + pad) / step) * step;
    for (let v = lo; v <= hi + step / 1000; v += step) ticks.push({ v: Number(v.toFixed(1)) });
  }
  const X = axis.log ? (v) => left + Math.log(v / lo) / Math.log(hi / lo) * (W - left - right) : (v) => left + (v - lo) / (hi - lo) * (W - left - right);
  const low = Math.min(...shown.map((r) => r.y - (r.sd || 0))), step = low < 50 ? 20 : low < 80 ? 10 : 5;
  const floor = Math.max(0, Math.min(100 - step, Math.floor((low - 1) / step) * step)), ceiling = 100;
  const Y = (v) => top + (1 - (v - floor) / (ceiling - floor)) * (H - top - bottom);
  const levels = [];
  for (let v = floor; v <= ceiling; v += step) levels.push(v);
  const line = frontier(shown.filter((r) => r.reliable !== "False"));
  const point = (r) => svg("g", { class: `m${r.modelAt % COLORS}${r.mine ? " mine" : ""}` },
    r.sd ? svg("line", { class: "spread", x1: X(r.x), x2: X(r.x), y1: Y(Math.min(ceiling, r.y + r.sd)), y2: Y(Math.max(floor, r.y - r.sd)) }) : null,
    r.mine ? svg("circle", { class: "ring", cx: X(r.x), cy: Y(r.y), r: 9 }) : null,
    svg("path", { class: "mark", d: SHAPES[r.graphAt % SHAPES.length](X(r.x), Y(r.y), 4.5) }));
  const marks = shown.filter((r) => !r.mine).concat(shown.filter((r) => r.mine)).map((r) => ({ r, node: point(r) }));
  const drawing = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `The chart shows the right trials and the ${axis.label} of ${shown.length} experiments. The table gives the values.` },
    levels.map((v) => [svg("line", { class: "grid", x1: left, x2: W - right, y1: Y(v), y2: Y(v) }), svg("text", { x: left - 6, y: Y(v) + 3.5, "text-anchor": "end", text: String(v) })]),
    svg("text", { x: 0, y: 8, text: "right trials (%)" }),
    ticks.map((tick) => svg("text", { x: X(tick.v), y: H - bottom + 13, "text-anchor": "middle", text: axis.tick(tick.v) })),
    svg("text", { x: (left + W - right) / 2, y: H - 3, "text-anchor": "middle", text: axis.label }),
    line.length > 1 ? svg("polyline", { class: "front", points: line.map((p) => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ") }) : null,
    marks.map((m) => m.node));
  const tip = el("div", { class: "tip", hidden: true });
  const chart = el("div", { class: "chart" }, drawing, tip);
  // The mark nearest the pointer answers, with every mark drawn on the same place, so a small or covered mark can be read.
  drawing.addEventListener("pointermove", (event) => {
    const box = drawing.getBoundingClientRect(), scale = box.width / W;
    const at = { x: (event.clientX - box.left) / scale, y: (event.clientY - box.top) / scale };
    const far = (m, from) => Math.hypot(X(m.r.x) - from.x, Y(m.r.y) - from.y);
    const near = marks.reduce((a, b) => far(a, at) <= far(b, at) ? a : b);
    const together = far(near, at) < 40 ? marks.filter((m) => far(m, { x: X(near.r.x), y: Y(near.r.y) }) < 7) : [];
    for (const m of marks) m.node.classList.toggle("near", together.includes(m));
    tip.hidden = !together.length;
    if (tip.hidden) return;
    tip.replaceChildren(...together.map((m) => el("div", {}, el("b", { text: m.r.name }),
      el("div", { text: `${m.r.y.toFixed(1)}%${m.r.sd === null ? "" : ` ±${m.r.sd.toFixed(1)}`}${m.r.counted ? ` · ${m.r.counted}` : " right"}` }), axis.say(m.r.x))));
    tip.style.left = Math.max(120, Math.min(box.width - 120, X(near.r.x) * scale)) + "px";
    tip.style.top = Math.max(22 + 50 * together.length, Y(near.r.y) * scale) + "px";
  });
  drawing.addEventListener("pointerleave", () => { tip.hidden = true; for (const m of marks) m.node.classList.remove("near"); });
  const unshown = all.length - shown.length;
  return el("section", {}, el("h2", { text: axis.title }), chart,
    el("p", { class: "note", text: (line.length > 1 ? `Each experiment on the Pareto line has more right trials than every experiment with ${axis.less}.` : "")
      + (unshown ? ` The chart does not show ${unshown === 1 ? "1 experiment that does" : `${unshown} experiments that do`} not have all cases.` : "") }));
}

// One measure for every experiment, laid out as the experiments are: each agent with each model.
function measureGrid(all) {
  const { side, top, sides, tops } = layout(all);
  const [title, key, show] = MEASURES[measure];
  const body = sides.map((name) => el("tr", {}, el("th", { scope: "row", class: "code", text: name }), tops.map((column) => {
    const r = all.find((x) => side(x) === name && top(x) === column), v = r ? number(r[key]) : null;
    if (v === null) return el("td", { class: "num sub", text: "–" });
    return el("td", { class: "num" + (r.mine ? " here" : ""), title: `${r.name}: ` + (r.complete === "True" ? r.counted || `${r.trials} trials` : `${r.trials} trials, not complete`) + "." },
      show(v), key === "reward" && r.sd !== null ? el("span", { class: "sub", text: ` ±${r.sd.toFixed(1)}` }) : null, r.complete === "True" ? null : el("span", { class: "sub", text: " *" }));
  })));
  const pick = el("select", { "aria-label": "Measure", onchange: (event) => { measure = Number(event.target.value); drawOverview(); } },
    MEASURES.map(([name, k], i) => all.some((r) => number(r[k]) !== null) ? el("option", { value: i, selected: i === measure, text: name }) : null));
  return el("section", {}, el("h2", { text: "Each experiment" }), el("label", { class: "pick" }, "Measure ", pick),
    el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", {}), tops.map(topHead))), el("tbody", {}, body))),
    el("p", { class: "note", text: `${title}.` + (all.some((r) => r.mine) ? " The cell with the color is the experiment of this trial." : "")
      + (all.some((r) => r.complete !== "True") ? " An asterisk shows an experiment that does not have all cases." : "") }));
}

// Every case that some experiment got wrong, the most wrong trials first, with one column per experiment.
function missGrid(tables, all, graphs, models, task, mine) {
  const named = shortNames(models), manyEfforts = all.some((a) => all.some((b) => a !== b && a.graph === b.graph && a.model === b.model));
  const columns = [...all].sort((a, b) => a.graphAt - b.graphAt || a.modelAt - b.modelAt || (a.effort < b.effort ? -1 : 1));
  const groupOf = graphs.length > 1 ? (r) => r.graph : (r) => r.model;
  const under = graphs.length > 1 ? (r) => named[r.model] + (manyEfforts ? " " + r.effort : "") : (r) => r.effort;
  const id = (r) => `${r.graph}|${r.model}|${r.effort}`;
  const byCase = new Map();
  let trials = 0, wrong = 0;
  for (const r of tables.cases) {
    const found = byCase.get(r.case) || byCase.set(r.case, { wrong: 0, trials: 0, cells: {} }).get(r.case);
    const cell = found.cells[id(r)] || (found.cells[id(r)] = { wrong: 0, trials: 0 });
    const miss = r.right !== "True";
    cell.trials++; found.trials++; trials++;
    if (miss) { cell.wrong++; found.wrong++; wrong++; }
  }
  const missed = [...byCase].filter(([, found]) => found.wrong).sort((a, b) => b[1].wrong - a[1].wrong || (a[0] < b[0] ? -1 : 1));
  const silent = all.reduce((n, r) => n + (number(r.no_proposal) || 0), 0);
  const title = el("h2", { text: "Cases with wrong trials" });
  const total = el("p", { text: `${count(wrong)} of ${count(trials)} trials are wrong. The wrong trials are in ${missed.length} of ${byCase.size} cases.`
    + (silent ? ` ${count(silent)} ${silent === 1 ? "trial has" : "trials have"} no proposal.` : "") });
  if (!missed.length) return el("section", {}, title, total);
  const first = (r, i) => i === 0 || groupOf(columns[i - 1]) !== groupOf(r);
  const up = (text, title) => el("th", { scope: "col", class: "up", title }, el("span", { text }));
  const groups = distinct(columns.map(groupOf)).map((g) => el("th", { scope: "colgroup", class: "code group", colspan: columns.filter((r) => groupOf(r) === g).length, text: g }));
  const body = missed.map(([name, found]) => el("tr", { class: name === task ? "here" : null }, el("th", { scope: "row", class: "code", text: name }),
    columns.map((r, i) => {
      const cell = found.cells[id(r)];
      const here = Boolean(mine) && name === task && sameExperiment(r, mine);
      if (!cell) return el("td", { class: first(r, i) ? "first sub" : "sub", text: "–" });
      return el("td", { class: first(r, i) ? "first" : null, title: `${name} · ${r.name}: ${cell.wrong} of ${cell.trials} trials are wrong.` },
        el("span", { class: `cell${cell.wrong === cell.trials ? " none" : cell.wrong ? " some" : ""}${here ? " here" : ""}`, text: cell.wrong ? String(cell.wrong) : "" }));
    }),
    el("td", { class: "num first", text: String(found.wrong) }),
    el("td", { class: "num", text: String(columns.filter((r) => found.cells[id(r)] && found.cells[id(r)].wrong).length) })));
  return el("section", {}, title, total,
    el("div", { class: "scroll" }, el("table", { class: "miss" },
      el("thead", {}, el("tr", {}, el("th", {}), groups, el("th", { colspan: 2 })),
        el("tr", {}, el("th", { scope: "col", text: "Case" }), columns.map((r) => up(under(r), r.name)), up("wrong trials"), up("experiments"))),
      el("tbody", {}, body))),
    el("p", { class: "note", text: "Each cell gives the number of wrong trials of one case in one experiment. An empty cell shows that all trials are right. "
      + "The last two columns give the wrong trials of the case, and the number of experiments that have a wrong trial." + (missed.some(([name]) => name === task) ? " The row with the color is the case of this trial." : "") }));
}

function allTable(all) {
  const shown = MEASURES.filter(([, key]) => all.some((r) => number(r[key]) !== null));
  const sorted = [...all].sort((a, b) => (b.y === null ? -1 : b.y) - (a.y === null ? -1 : a.y) || (number(a.cost_per_case_usd) || 0) - (number(b.cost_per_case_usd) || 0));
  return el("details", {}, el("summary", { text: `Table of the ${all.length} experiments` }), el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, ["Agent", "Model", "Effort"].map((h) => el("th", { scope: "col", text: h })), shown.map(([name]) => el("th", { scope: "col", class: "num wrap", text: name })), el("th", { scope: "col", class: "num", text: "Trials" }))),
    el("tbody", {}, sorted.map((r) => el("tr", { class: r.mine ? "here" : null }, el("td", { class: "code", text: r.graph }), el("td", { class: "code", text: r.model }), el("td", { class: "code", text: r.effort }),
      shown.map(([, key, show]) => el("td", { class: "num", text: number(r[key]) === null ? "" : show(number(r[key])) + (key === "reward" && r.sd !== null ? ` ±${r.sd.toFixed(1)}` : "") })),
      el("td", { class: "num", text: r.trials + (r.complete === "True" ? "" : " (not complete)") })))))));
}
</script>
